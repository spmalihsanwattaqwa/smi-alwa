<!doctype html>
<html lang="en">

    <script>
      (function() {
        try {
          var originalFetch = window.fetch || (typeof globalThis !== 'undefined' ? globalThis.fetch : null);
          if (originalFetch) {
            var currentFetch = originalFetch;
            var descriptor = {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            };
            Object.defineProperty(window, 'fetch', descriptor);
            if (typeof globalThis !== 'undefined') {
              try {
                Object.defineProperty(globalThis, 'fetch', descriptor);
              } catch (e) {}
            }
          }
        } catch (err) {
          console.warn("Could not patch window.fetch setter safely:", err);
        }
      })();
    </script>
